name: FoodRescueAI Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android project is complete
        run: |
          flutter create . --platforms=android --project-name foodrescue_ai
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('android:label="foodrescue_ai"', 'android:label="FoodRescue AI"')
          p.write_text(s)
          p=Path("android/app/build.gradle")
          s=p.read_text().replace('minSdk flutter.minSdkVersion', 'minSdk 26')
          p.write_text(s)
          PY

      - name: Fetch trained freshness model
        run: bash scripts_prepare_ai_model.sh

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk FoodRescueAI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoodRescueAI
          path: FoodRescueAI.apk
